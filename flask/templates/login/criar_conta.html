{% extends "tela_inicial/base.html" %}
{% block title %}Criar Nova Conta{% endblock %}

{%block content%}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-9">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 card-title text-center mb-4" style="color: var(--azul-primary);">Criar Nova Conta</h1>
                <form method="post">
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF (Apenas números)</label>
                        <input type="text" name="cpf" id="cpf" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" name="nome" id="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" name="email" id="email" class="form-control" required>
                    </div>
                    
                    <hr class="my-4">

                    <div class="mb-3">
                        <label for="login" class="form-label">Login (Nome de Utilizador)</label>
                        <input type="text" name="login" id="login" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha_confirm" class="form-label">Confirmar Senha</label>
                        <input type="password" name="senha_confirm" id="senha_confirm" class="form-control" required>
                    </div>
                    
                    <!-- <div class="mb-3">
                        <label for="role" class="form-label">Tipo de Conta</label>
                        <select name="role" id="role" class="form-select" required>
                            <option value="cliente" selected>Cliente (Passageiro)</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div> -->

                    <button type="submit" class="btn btn-primary w-100">Criar Conta</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('login')}}" class="btn btn-link">Já é cliente? Acesse a sua conta</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
