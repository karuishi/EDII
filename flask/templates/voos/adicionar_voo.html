{% extends "tela_inicial/base.html" %}
{% block title %}Adicionar Voo{% endblock %}
{% block content %}
    <h1>Adicionar Novo Voo</h1>
    
    <form method="post" class="mt-4 p-4 border rounded shadow-sm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="codigo" class="form-label">Código:</label>
                <input type="text" name="codigo" id="codigo" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="aeronave" class="form-label">Aeronave:</label>
                <input type="text" name="aeronave" id="aeronave" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="origem" class="form-label">Origem:</label>
                <input type="text" name="origem" id="origem" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="destino" class="form-label">Destino:</label>
                <input type="text" name="destino" id="destino" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="preco_ida" class="form-label">Preço Ida:</label>
                <input type="number" step="0.01" name="preco_ida" id="preco_ida" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="preco_volta" class="form-label">Preço Volta:</label>
                <input type="number" step="0.01" name="preco_volta" id="preco_volta" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="milhas" class="form-label">Milhas:</label>
                <input type="number" name="milhas" id="milhas" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="total_assentos" class="form-label">Total de Assentos:</label>
                <input type="number" name="total_assentos" id="total_assentos" class="form-control" required>
            </div>
        </div>
        
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Adicionar Voo</button>
            <a href="{{ url_for('listar_voos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
{% endblock %}
