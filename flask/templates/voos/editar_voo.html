{% extends "tela_inicial/base.html" %}
{% block title %}Editar Voo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                
                <div class="card-header bg-primary text-white p-4 p-md-5 text-center position-relative overflow-hidden">
                    <div class="position-absolute top-0 start-0 w-100 h-100 opacity-10" 
                         style="background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.4) 0%, transparent 50%); pointer-events: none;"></div>
                    
                    <div class="position-relative z-1">
                        <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle mb-3 shadow-sm" style="width: 64px; height: 64px;">
                            <i class="bi bi-pencil-square fs-3"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Editar Voo {{ codigo_voo }}</h2>
                        <p class="text-white-50 mb-0">Atualize as informações de rota, preços e capacidade.</p>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5 bg-body-tertiary">
                    <form method="post" class="row g-4">
                        
                        <div class="col-12">
                            <h6 class="text-uppercase text-muted fw-bold small mb-2">
                                <i class="bi bi-geo-alt me-1"></i> Rota e Aeronave
                            </h6>
                            <hr class="mt-0 opacity-25">
                        </div>

                        <div class="col-md-4">
                            <div class="form-floating">
                                <input type="text" 
                                       name="codigo" 
                                       id="codigo" 
                                       class="form-control rounded-3 border-0 shadow-sm bg-secondary-subtle" 
                                       value="{{ codigo_voo }}" 
                                       disabled>
                                <label for="codigo" class="text-muted fw-bold">Código (Bloqueado)</label>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="form-floating">
                                <input type="text" 
                                       name="aeronave" 
                                       id="aeronave" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Aeronave }}" 
                                       placeholder="Aeronave" 
                                       required>
                                <label for="aeronave" class="text-muted fw-bold">Modelo da Aeronave</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" 
                                       name="origem" 
                                       id="origem" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Origem }}" 
                                       placeholder="Origem" 
                                       required
                                       oninput="this.value = this.value.replace(/[^a-zA-Z\u00C0-\u00FF ]/g, '')">
                                <label for="origem" class="text-muted fw-bold">Aeroporto de Origem</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" 
                                       name="destino" 
                                       id="destino" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Destino }}" 
                                       placeholder="Destino" 
                                       required
                                       oninput="this.value = this.value.replace(/[^a-zA-Z\u00C0-\u00FF ]/g, '')">
                                <label for="destino" class="text-muted fw-bold">Aeroporto de Destino</label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <h6 class="text-uppercase text-muted fw-bold small mb-2">
                                <i class="bi bi-currency-dollar me-1"></i> Tarifas e Capacidade
                            </h6>
                            <hr class="mt-0 opacity-25">
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="number" 
                                       step="0.01" 
                                       name="preco_ida" 
                                       id="preco_ida" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Preco_ida }}" 
                                       placeholder="0.00" 
                                       required
                                       inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9.,]/g, '')">
                                <label for="preco_ida" class="text-muted fw-bold">Preço Ida (R$)</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="number" 
                                       step="0.01" 
                                       name="preco_volta" 
                                       id="preco_volta" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Preco_volta }}" 
                                       placeholder="0.00" 
                                       required
                                       inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9.,]/g, '')">
                                <label for="preco_volta" class="text-muted fw-bold">Preço Volta (R$)</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="number" 
                                       name="milhas" 
                                       id="milhas" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Milhas }}" 
                                       placeholder="0" 
                                       required 
                                       inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9.,]/g, '')">
                                <label for="milhas" class="text-muted fw-bold">Milhas Geradas</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="number" 
                                       name="total_assentos" 
                                       id="total_assentos" 
                                       class="form-control rounded-3 border-0 shadow-sm" 
                                       value="{{ voo.Total_assentos }}" 
                                       placeholder="0" 
                                       required 
                                       inputmode="numeric"
                                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                <label for="total_assentos" class="text-muted fw-bold">Total de Assentos</label>
                            </div>
                        </div>

                        <div class="col-12 mt-5 d-flex flex-column flex-md-row gap-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold px-5 shadow-sm flex-grow-1">
                                <i class="bi bi-save me-2"></i> Salvar Alterações
                            </button>
                            <a href="{{ url_for('listar_voos') }}" class="btn btn-outline-secondary btn-lg rounded-pill fw-bold px-4 border-0 bg-white shadow-sm">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
