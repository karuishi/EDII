<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <title>{% block title %}{% endblock %} - Linhas Aéreas SOL</title>
    
</head>
<body class="bg-body-tertiary"> <header class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="{{ url_for('login') }}" class="navbar-brand">Linhas Aéreas SOL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('listar_clientes') }}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('listar_voos') }}">Voos (Admin)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('listar_reservas') }}">Reservas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('pagina_passageiro') }}">Pesquisar Voos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Logout</a>
                    </li>
                    <li class="nav-item ms-3">
                        <button id="darkModeToggle" class="btn btn-outline-light btn-sm"></button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 text-muted">
        <p>&copy; 2025 Linhas Aéreas SOL. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        (function() {
            const htmlElement = document.documentElement;
            const toggleButton = document.getElementById('darkModeToggle');
            const toggleTextLight = 'Modo Claro';
            const toggleTextDark = 'Modo Escuro';

            // Função para aplicar o modo e o texto do botão
            function applyTheme(theme) {
                if (theme === 'dark') {
                    htmlElement.setAttribute('data-bs-theme', 'dark');
                    toggleButton.textContent = toggleTextLight;
                } else {
                    htmlElement.setAttribute('data-bs-theme', 'light');
                    toggleButton.textContent = toggleTextDark;
                }
            }

            // Verifica o tema salvo no localStorage
            let currentTheme = localStorage.getItem('theme');
            if (!currentTheme) {
                currentTheme = 'light'; // Define 'light' como padrão se nada for salvo
            }
            applyTheme(currentTheme);

            // Adiciona o evento de clique ao botão
            toggleButton.addEventListener('click', function() {
                // Verifica qual é o tema atual
                const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                
                // Salva e aplica o novo tema
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        })();
    </script>
</body>
</html>
