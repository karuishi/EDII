{% extends "base.html" %}
{% block title %}Adicionar Cliente{% endblock %}
{% block content %}
    <h1>Adicionar Novo Cliente</h1>
    <form method="post">
        CPF (só números): <input type="text" name="cpf" required><br>
        Nome: <input type="text" name="nome" required><br>
        Data Viagem (DD/MM/AAAA): <input type="text" name="data_viagem" required><br>
        Milhas: <input type="text" name="milhas" required><br>
        <input type="submit" value="Adicionar Cliente">
    </form>
    <a href="{{ url_for('listar_clientes') }}">Cancelar</a>
{% endblock %}
